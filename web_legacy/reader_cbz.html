<!doctype html><html><head><meta charset="utf-8"><title>Comic/Manga • Reader</title>
<link rel="stylesheet" href="assets/normalize.css"><link rel="stylesheet" href="assets/ui.css">
<style>
.wrap{padding:12px}
.toolbar{position:sticky;top:0;background:rgba(15,23,42,.9);backdrop-filter:blur(6px);padding:8px;display:flex;gap:8px;align-items:center;border-bottom:1px solid rgba(148,163,184,.2);z-index:20}
.pages{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:8px}
.pages img{max-width:95vw;border-radius:8px;border:1px solid rgba(148,163,184,.2)}
</style></head><body>
<div class="wrap">
  <div class="toolbar">
    <a href="home.html">← Home</a>
    <span style="margin-left:auto"></span>
    <label><input type="checkbox" id="rtl"> Right-to-left</label>
  </div>
  <div id="pages" class="pages"></div>
</div>
<script>
const Q=new URLSearchParams(location.search); const ID=Q.get('id');
let ITEM=null, PAGES=[];
async function load(){
  const r=await fetch('/api/library/item/'+encodeURIComponent(ID)); ITEM=await r.json();
  if(ITEM.error){ document.body.innerHTML='Not found'; return; }
  const pr=await fetch('/api/reader/cbz_pages?path='+encodeURIComponent(ITEM.path)); const j=await pr.json();
  PAGES=j.pages||[]; render();
}
function render(){
  const box=document.getElementById('pages'); box.innerHTML='';
  const rtl=document.getElementById('rtl').checked;
  const pages = rtl ? [...PAGES].reverse() : PAGES;
  pages.forEach(n=>{
    const img=document.createElement('img'); img.src = '/media/cbz_image?path='+encodeURIComponent(ITEM.path)+'&name='+encodeURIComponent(n);
    box.appendChild(img);
  });
}
document.addEventListener('DOMContentLoaded', load);
document.getElementById('rtl').addEventListener('change', render);
</script>
</body></html>
