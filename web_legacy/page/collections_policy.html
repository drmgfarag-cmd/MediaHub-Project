<!doctype html><html><head><link rel='icon' href="../assets/favicon.svg'><link rel='stylesheet' href="../assets/ui.css'><link rel='stylesheet' href="../assets/normalize.css'><meta name='viewport' content='width=device-width, initial-scale=1'><meta charset='utf-8'><title>Media Hub — Collections Policy</title></head><body><header class='appbar'><div class='title'>Media Hub</div><div class='subtitle'>Unified Library • RD • Downloader • Editor</div></header>
<h2>Collections Policy</h2>
<label>Merge strategy:
<select id="ms">
  <option value="merge">Merge</option>
  <option value="override">Override</option>
  <option value="append">Append</option>
</select></label>
<label><input type="checkbox" id="rest"> Rest‑only</label>
<button onclick="savePol()">Save</button>
<script>
async function loadPol(){ const j=await (await fetch('/api/collections/policy')).json(); document.getElementById('ms').value=j.merge_strategy||'merge'; document.getElementById('rest').checked=!!j.rest_only; }
async function savePol(){ const body={merge_strategy: document.getElementById('ms').value, rest_only: document.getElementById('rest').checked}; await fetch('/api/collections/policy',{method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify(body)}); UI.toast('Saved'); }
loadPol();
</script>
<script defer src="../assets/ui_enhance.js'></script></body></html>
