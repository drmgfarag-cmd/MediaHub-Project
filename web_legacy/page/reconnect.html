<!doctype html><html><head><link rel='icon' href="../assets/favicon.svg'><link rel='stylesheet' href="../assets/ui.css'><link rel='stylesheet' href="../assets/normalize.css'><meta name='viewport' content='width=device-width, initial-scale=1'><meta charset="utf-8"><title>Media Hub — Reconnect</title>
<link rel="stylesheet" href="/web/ui/common.css"><script src="/web/ui/common.js"></script></head>
<body><header class='appbar'><div class='title'>Media Hub</div><div class='subtitle'>Unified Library • RD • Downloader • Editor</div></header><div class="shell"><main class="content">
<div class="card"><h3>Reconnect</h3>
<label><input type="checkbox" id="rec_enabled"> Enable Reconnect</label>
<pre id="rec_out"></pre>
</div></main></div>
<script>
async function recLoad(){ const j=await (await fetch('/api/reconnect')).json(); document.getElementById('rec_enabled').checked=!!j.enabled; document.getElementById('rec_method').value=j.method||'none'; document.getElementById('rec_out').textContent=JSON.stringify(j,null,2); }
async function recSave(){ const enabled=document.getElementById('rec_enabled').checked; const method=document.getElementById('rec_method').value||'none'; await fetch('/api/reconnect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled,method})}); recLoad(); }
document.addEventListener('DOMContentLoaded', recLoad);
</script>
<script defer src="../assets/ui_enhance.js'></script></body></html>
