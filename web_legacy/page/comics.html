<!doctype html><html><head><link rel='icon' href="../assets/favicon.svg'><link rel='stylesheet' href="../assets/ui.css'><link rel='stylesheet' href="../assets/normalize.css'><meta name='viewport' content='width=device-width, initial-scale=1'><meta charset="utf-8"><title>Media Hub — Comics</title>
<link rel="stylesheet" href="/web/ui/common.css"><script src="/web/ui/common.js"></script></head>
<body><header class='appbar'><div class='title'>Media Hub</div><div class='subtitle'>Unified Library • RD • Downloader • Editor</div></header><div class="shell"><main class="content">
<div class="card"><h3>Comics Library</h3>
<div id="list"></div>
</div></main></div>
<script>
async function load(){ const lib=await (await fetch('/api/collections/rest_all')).json(); const items = (lib.items && lib.items.comics) || []; const box=document.getElementById('list'); box.innerHTML = (items||[]).map(it=>`<div>${it.title||'(Untitled)'}</div>`).join(''); }
document.addEventListener('DOMContentLoaded', load);
</script>
<script defer src="../assets/ui_enhance.js'></script></body></html>
