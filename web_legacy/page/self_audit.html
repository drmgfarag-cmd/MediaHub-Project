<!doctype html><html><head><link rel='icon' href="../assets/favicon.svg'><link rel='stylesheet' href="../assets/ui.css'><link rel='stylesheet' href="../assets/normalize.css'><meta name='viewport' content='width=device-width, initial-scale=1'><meta charset="utf-8"><title>Media Hub — Self Audit</title>
<link rel="stylesheet" href="/web/ui/common.css"><script src="/web/ui/common.js"></script></head>
<body><header class='appbar'><div class='title'>Media Hub</div><div class='subtitle'>Unified Library • RD • Downloader • Editor</div></header><div class="shell"><main class="content">
<div class="card"><h3>Self-Audit</h3>
<button onclick="run()">Run</button> <button onclick="smoke()">5× Smoke</button> <button onclick="pack()">Support Pack</button>
<pre id="out"></pre>
</div>
</main></div>
<script>
async function run(){ const r = await fetch('/api/self_audit/run',{method:'POST'}); const j=await r.json(); document.getElementById('out').textContent = JSON.stringify(j, null, 2); }
async function smoke(){ const r = await fetch('/api/tests/smoke',{method:'POST'}); const j=await r.json(); document.getElementById('out').textContent = JSON.stringify(j, null, 2); }
async function pack(){ const r = await fetch('/api/support/collect',{method:'POST'}); const j=await r.json(); if(j.url) location.href=j.url; }
document.addEventListener('DOMContentLoaded', run);
</script>
<script defer src="../assets/ui_enhance.js'></script></body></html>
