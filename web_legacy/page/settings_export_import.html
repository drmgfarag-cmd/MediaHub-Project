<!doctype html><html><head><meta charset="utf-8"><title>Export / Import</title>
<style>
body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#0f1115;color:#e7ecf1}
.card{background:#10141d;border:1px solid #222632;border-radius:12px;padding:12px;margin:12px}
button,input,textarea{padding:6px 10px;border:1px solid #2a3040;border-radius:8px;background:#12151d;color:#e7ecf1}
button:hover{background:#1b2330}
pre{white-space:pre-wrap;background:#0b0e14;border:1px solid #222632;border-radius:8px;padding:8px}
</style></head><body>
<div class="card">
  <h2 style="margin:0 0 8px 0">Export / Import</h2>
  <div style="display:flex;gap:8px;margin-bottom:8px">
    <button onclick="doExport()">Export (JSON)</button>
    <input type="file" id="file" accept="application/json">
    <button onclick="doPreview()">Preview Import</button>
    <button onclick="doApply()">Apply Import</button>
  </div>
  <pre id="out"></pre>
</div>
<script>
async function doExport(){
  const r=await fetch('/api/export/do'); const j=await r.json();
  document.getElementById('out').textContent = JSON.stringify(j,null,2);
}
async function doPreview(){
  const f=document.getElementById('file').files[0]; if(!f) return alert('Choose a JSON file');
  const txt=await f.text(); const obj=JSON.parse(txt);
  const r=await fetch('/api/import/preview',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)});
  const j=await r.json(); document.getElementById('out').textContent = JSON.stringify(j,null,2);
}
async function doApply(){
  const f=document.getElementById('file').files[0]; if(!f) return alert('Choose a JSON file');
  const txt=await f.text(); const obj=JSON.parse(txt);
  const r=await fetch('/api/import/apply',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)});
  const j=await r.json(); document.getElementById('out').textContent = JSON.stringify(j,null,2);
}
</script>
</body></html>
