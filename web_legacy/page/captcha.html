<!doctype html><html><head><link rel='icon' href="../assets/favicon.svg'><link rel='stylesheet' href="../assets/ui.css'><link rel='stylesheet' href="../assets/normalize.css'><meta name='viewport' content='width=device-width, initial-scale=1'><meta charset="utf-8"><title>Media Hub — Captcha</title>
<link rel="stylesheet" href="/web/ui/common.css"><script src="/web/ui/common.js"></script></head>
<body><header class='appbar'><div class='title'>Media Hub</div><div class='subtitle'>Unified Library • RD • Downloader • Editor</div></header><div class="shell"><main class="content">
<div class="card"><h3>Captcha Settings</h3>
<pre id="cap_out"></pre>
</div></main></div>
<script>
async function capLoad(){ const j=await (await fetch('/api/captcha')).json(); document.getElementById('cap_timeout').value=j.timeout||10000; document.getElementById('cap_out').textContent=JSON.stringify(j,null,2); }
async function capSave(){ const timeout=parseInt(document.getElementById('cap_timeout').value||'10000'); await fetch('/api/captcha',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({timeout})}); capLoad(); }
document.addEventListener('DOMContentLoaded', capLoad);
</script>
<script defer src="../assets/ui_enhance.js'></script></body></html>
