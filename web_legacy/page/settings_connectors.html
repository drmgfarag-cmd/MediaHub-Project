<!doctype html><html><head><meta charset="utf-8"><title>Connectors</title>
<style>
body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#0f1115;color:#e7ecf1}
.card{background:#10141d;border:1px solid #222632;border-radius:12px;padding:12px;margin:12px}
button{padding:6px 10px;border:1px solid #2a3040;border-radius:8px;background:#12151d;color:#e7ecf1}
button:hover{background:#1b2330}
.badge{padding:2px 6px;border-radius:999px;border:1px solid #2a3040;background:#171a21;font-size:12px;margin-left:6px}
</style></head><body>
<div class="card">
  <h2 style="margin:0 0 8px 0">Connectors</h2>
  <div id="list"></div>
</div>
<script>
async function refresh(){
  const r=await fetch('/api/connectors/list'); const j=await r.json();
  const list=document.getElementById('list'); list.innerHTML='';
  (j.connectors||[]).forEach(c=>{
    const latest=(j.latest||{})[c.id]||c.version;
    const upd = (latest!==c.version) ? `<span class="badge">Update: ${c.version} → ${latest}</span>`:'';
    const row=document.createElement('div'); row.style.margin='6px 0';
    row.innerHTML = `<b>${c.name}</b> <span class="badge">${c.id}</span> <span class="badge">v${c.version}</span> ${upd} <br><small>TOS: ${c.tos}</small><br>` +
      `<button onclick="toggle('${c.id}', ${!c.enabled})">${c.enabled?'Disable':'Enable'}</button>`;
    list.appendChild(row);
  });
}
async function toggle(id, enabled){
  await fetch('/api/connectors/enable',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id, enabled})});
  refresh();
}
document.addEventListener('DOMContentLoaded', refresh);
</script>
</body></html>
