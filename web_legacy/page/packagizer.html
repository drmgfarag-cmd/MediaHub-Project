<!doctype html><html><head><link rel='icon' href="../assets/favicon.svg'><link rel='stylesheet' href="../assets/ui.css'><link rel='stylesheet' href="../assets/normalize.css'><meta name='viewport' content='width=device-width, initial-scale=1'><meta charset="utf-8"><title>Media Hub — Packagizer</title>
<link rel="stylesheet" href="/web/ui/common.css"><script src="/web/ui/common.js"></script></head>
<body><header class='appbar'><div class='title'>Media Hub</div><div class='subtitle'>Unified Library • RD • Downloader • Editor</div></header><div class="shell"><main class="content"><div class="card">
<h3>Packagizer Rules</h3>
<div class="inline" style="gap:6px;margin:6px 0">
  <button class="iconbtn" onclick="addRule()">Add</button>
  <button class="iconbtn" onclick="saveRules()">Save</button>
</div>
<pre id="rules_out" style="max-height:60vh;overflow:auto"></pre>
</div></main></div>
<script>
let RULES={rules:[]};
async function loadRules(){ RULES = await (await fetch('/api/packagizer/rules')).json(); render(); }
function render(){ document.getElementById('rules_out').textContent = JSON.stringify(RULES, null, 2); }
function addRule(){ const r={}; const host=r_host.value.trim(); const contains=r_contains.value.trim(); const dest=r_dest.value.trim(); const pack=r_pack.value.trim(); const limit=parseInt(r_limit.value||'0'); const prio=parseInt(r_prio.value||'0'); if(host) r.host=host; if(contains) r.contains=contains; if(dest) r.dest=dest; if(pack) r.pack=pack; if(limit>0) r.limit_kbps=limit; if(prio>0) r.priority=prio; RULES.rules.push(r); render(); }
async function saveRules(){ await fetch('/api/packagizer/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(RULES)}); UI.toast('Saved'); }
document.addEventListener('DOMContentLoaded', loadRules);
</script>
<script defer src="../assets/ui_enhance.js'></script></body></html>
