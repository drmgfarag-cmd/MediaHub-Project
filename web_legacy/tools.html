<!doctype html><html><head><meta charset='utf-8'><title>Tools</title><link rel='stylesheet' href='assets/ui.css'></head><body><div class='wrap'><h1>Tools</h1>
<div class="card">
  <h3>Diagnostics</h3>
  <button onclick="run()">Run checks</button>
  <pre id="out"></pre>
</div>
<div class="card">
  <h3>Export / Import</h3>
  <a href="/storage.zip" download>Download all storage JSONs</a>
  <p>To restore, replace files in storage/ and restart the server.</p>
</div>
<script>
async function run(){ const j=await (await fetch('/api/diagnostics')).json(); document.getElementById('out').textContent=JSON.stringify(j,null,2); }
</script>

<div class="card"><h3>Sort Editor</h3><a href="sort_editor.html">Open</a></div>

<div class="card"><h3>Dedupe Editor</h3><a href="dedupe_editor.html">Open</a></div>

<div class="card"><h3>Library Tree</h3><a href="tree.html">Open</a></div>

<div class="card">
  <h3>Import Validator</h3>
  <p>Paste JSON from a storage file to validate schema.</p>
  <textarea id="imp_json" style="width:100%;height:160px"></textarea>
  <div><button id="imp_validate">Validate</button></div>
  <pre id="imp_out"></pre>
</div>
<script>
document.getElementById('imp_validate').onclick=()=>{
  const txt=document.getElementById('imp_json').value||'{}';
  try{
    const j=JSON.parse(txt);
    const keys=Object.keys(j).length;
    document.getElementById('imp_out').textContent = 'OK — keys: '+keys+'\n'+JSON.stringify(j,null,2);
  }catch(e){
    document.getElementById('imp_out').textContent = 'ERROR — '+e.message;
  }
};
</script>
</div></body></html>
