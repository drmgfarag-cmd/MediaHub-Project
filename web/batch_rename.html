<!doctype html><html><head><meta charset="utf-8"><title>Batch Rename</title>
<link rel="stylesheet" href="assets/normalize.css"><link rel="stylesheet" href="assets/ui.css"></head>
<body><div class="wrap">
  <div class="toolbar"><a href="home.html">← Home</a> · <strong>Batch Rename</strong> <button id="preview">Preview</button> <button id="apply">Apply</button> <button id="undo">Undo</button></div>
  <div class="card">
    <div>Format string (use tokens): <input id="fmt" style="width:70%" value="{title}.{year}.{ext}"></div>
    <div style="opacity:.85;margin:6px 0">Tokens: {title} {year} {ext} {season} {episode}</div>
    <div>Include globs (CSV): <input id="inc" style="width:60%" placeholder="**/*.mkv, **/*.mp4, **/*.mp3"></div>
    <div>Exclude globs (CSV): <input id="exc" style="width:60%" placeholder="**/Extras/**"></div>
  </div>
  <div class="card" id="out">–</div>
</div>
<script>
async function doPreview(){
  const j=await (await fetch('/api/rename/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({format: fmt.value, include: inc.value.split(',').map(s=>s.trim()).filter(Boolean), exclude: exc.value.split(',').map(s=>s.trim()).filter(Boolean)})})).json();
  if(!j.ok){ out.textContent='Error: '+(j.error||''); return; }
  plans=(j.plans||[]);
  out.innerHTML = plans.length? plans.slice(0,300).map(p=>`<div class="text-clip">${p.from} <span class="badge">→</span> ${p.to}</div>`).join('') : 'No changes.';
}
async function doApply(){
  if(!plans||!plans.length){ out.textContent='Nothing to apply.'; return; }
  const j=await (await fetch('/api/rename/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plans:plans, dry:false})})).json();
  out.textContent = j.ok? ('Renamed '+j.moved+' files.') : ('Error: '+(j.error||''));
}
async function doUndo(){
  const j=await (await fetch('/api/rename/undo',{method:'POST'})).json();
  out.textContent = j.ok? ('Restored '+j.restored+' files.') : ('Error: '+(j.error||''));
}
let plans=[]; const fmt=document.getElementById('fmt'), inc=document.getElementById('inc'), exc=document.getElementById('exc'), out=document.getElementById('out');
document.getElementById('preview').onclick=doPreview;
document.getElementById('apply').onclick=doApply;
document.getElementById('undo').onclick=doUndo;
</script>
</body></html>
