<!doctype html><html><head><meta charset="utf-8"><title>MediaHub — LinkGrabber</title>
<link rel="stylesheet" href="assets/normalize.css"><link rel="stylesheet" href="assets/ui.css">
<style>
.linkgrabber-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 120px); }
.input-panel, .results-panel { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 20px; }
.input-area { width: 100%; height: 300px; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; padding: 10px; color: #fff; font-family: monospace; resize: vertical; }
.grab-button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; }
.grab-button:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
.link-item { background: rgba(255,255,255,0.08); margin: 8px 0; padding: 12px; border-radius: 6px; border-left: 4px solid #667eea; }
.link-host { color: #667eea; font-weight: 600; font-size: 12px; text-transform: uppercase; }
.link-url { color: #ccc; font-size: 14px; word-break: break-all; margin: 4px 0; }
.link-actions { display: flex; gap: 8px; margin-top: 8px; }
.action-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
.action-btn:hover { background: rgba(255,255,255,0.2); }
.stats { display: flex; gap: 20px; margin-bottom: 15px; }
.stat-item { text-align: center; }
.stat-number { font-size: 24px; font-weight: 700; color: #667eea; }
.stat-label { font-size: 12px; color: #999; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar"><a href="downloader.html">← Downloader</a> · <strong>LinkGrabber</strong></div>
  
  <div class="linkgrabber-container">
    <div class="input-panel">
      <h3>Input Sources</h3>
      <textarea class="input-area" id="inputText" placeholder="Paste URLs, text with links, or upload container files (DLC, CCF, RSDF)...

Supported sources:
• Direct HTTP/HTTPS URLs
• Magnet links
• Container files (DLC, CCF, RSDF)
• Text with embedded links
• Clipboard content

Examples:
https://example.com/file.zip
magnet:?xt=urn:btih:...
http://rapidgator.net/file/..."></textarea>
      
      <div style="margin-top: 10px;">
        <input type="file" id="containerFile" accept=".dlc,.ccf,.rsdf" style="display: none;">
        <button onclick="document.getElementById('containerFile').click()" class="action-btn">Upload Container</button>
        <button onclick="grabFromClipboard()" class="action-btn">Grab from Clipboard</button>
        <button onclick="grabLinks()" class="grab-button">🔗 Grab Links</button>
      </div>
    </div>
    
    <div class="results-panel">
      <h3>Grabbed Links</h3>
      <div class="stats">
        <div class="stat-item">
          <div class="stat-number" id="totalLinks">0</div>
          <div class="stat-label">Total Links</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="validLinks">0</div>
          <div class="stat-label">Valid</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" id="premiumLinks">0</div>
          <div class="stat-label">Premium</div>
        </div>
      </div>
      
      <div id="linkResults">
        <div style="text-align: center; color: #666; margin-top: 50px;">
          No links grabbed yet. Paste URLs or text in the input area and click "Grab Links".
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let grabbedLinks = [];

async function grabLinks() {
  const input = document.getElementById('inputText').value.trim();
  if (!input) {
    alert('Please enter some text or URLs to grab links from.');
    return;
  }
  
  try {
    const response = await fetch('/api/downloader/linkgrabber', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: input })
    });
    
    const result = await response.json();
    if (result.success) {
      grabbedLinks = result.links || [];
      displayLinks();
      updateStats();
    } else {
      alert('Error grabbing links: ' + (result.error || 'Unknown error'));
    }
  } catch (error) {
    alert('Network error: ' + error.message);
  }
}

function displayLinks() {
  const container = document.getElementById('linkResults');
  
  if (grabbedLinks.length === 0) {
    container.innerHTML = '<div style="text-align: center; color: #666; margin-top: 50px;">No valid links found in the input.</div>';
    return;
  }
  
  container.innerHTML = grabbedLinks.map((link, index) => `
    <div class="link-item">
      <div class="link-host">${link.host || 'Unknown Host'}</div>
      <div class="link-url">${link.url}</div>
      <div class="link-actions">
        <button class="action-btn" onclick="addToQueue(${index})">Add to Queue</button>
        <button class="action-btn" onclick="copyLink(${index})">Copy</button>
        <button class="action-btn" onclick="removeLink(${index})">Remove</button>
        ${link.premium ? '<span style="color: #4CAF50; font-size: 10px;">PREMIUM</span>' : ''}
      </div>
    </div>
  `).join('');
}

function updateStats() {
  document.getElementById('totalLinks').textContent = grabbedLinks.length;
  document.getElementById('validLinks').textContent = grabbedLinks.filter(l => l.valid).length;
  document.getElementById('premiumLinks').textContent = grabbedLinks.filter(l => l.premium).length;
}

async function addToQueue(index) {
  const link = grabbedLinks[index];
  try {
    const response = await fetch('/api/downloader/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: link.url, package: 'LinkGrabber Import' })
    });
    
    const result = await response.json();
    if (result.success) {
      alert('Link added to download queue!');
    } else {
      alert('Error adding to queue: ' + (result.error || 'Unknown error'));
    }
  } catch (error) {
    alert('Network error: ' + error.message);
  }
}

function copyLink(index) {
  const link = grabbedLinks[index];
  navigator.clipboard.writeText(link.url).then(() => {
    alert('Link copied to clipboard!');
  });
}

function removeLink(index) {
  grabbedLinks.splice(index, 1);
  displayLinks();
  updateStats();
}

async function grabFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('inputText').value = text;
    alert('Clipboard content pasted! Click "Grab Links" to process.');
  } catch (error) {
    alert('Could not access clipboard. Please paste manually.');
  }
}

// Handle container file upload
document.getElementById('containerFile').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const formData = new FormData();
  formData.append('container', file);
  
  try {
    const response = await fetch('/api/downloader/containers', {
      method: 'POST',
      body: formData
    });
    
    const result = await response.json();
    if (result.success) {
      grabbedLinks = result.links || [];
      displayLinks();
      updateStats();
      alert(`Container file processed! Found ${grabbedLinks.length} links.`);
    } else {
      alert('Error processing container: ' + (result.error || 'Unknown error'));
    }
  } catch (error) {
    alert('Network error: ' + error.message);
  }
});

// Initialize
updateStats();
</script>
</body></html>
