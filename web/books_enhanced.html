<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaHub - Books</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/books_enhanced.css">
    <style>
        /* Books Enhanced Styles */
        .books-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .books-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .books-title {
            font-size: 2.5em;
            font-weight: 700;
            color: #fff;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .books-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .scan-button, .view-toggle {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .scan-button:hover, .view-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .books-search {
            width: 300px;
            padding: 12px 20px;
            border: 2px solid #333;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            backdrop-filter: blur(10px);
        }

        .books-search::placeholder {
            color: rgba(255,255,255,0.7);
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .book-card {
            background: linear-gradient(145deg, #2a2a3e, #1e1e32);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .book-cover {
            width: 120px;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .book-cover-placeholder {
            width: 120px;
            height: 160px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 8px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .book-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.3;
            height: 36px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .book-author {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .book-progress {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .book-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .book-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #888;
        }

        /* Reading Interface */
        .reading-interface {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .reading-header {
            background: #2a2a2a;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .reading-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .reading-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .reading-button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .reading-button:hover {
            background: #5a67d8;
        }

        .page-navigation {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .page-input {
            width: 60px;
            padding: 5px;
            text-align: center;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 3px;
        }

        .reading-content {
            flex: 1;
            overflow: auto;
            padding: 40px;
            background: #fff;
            color: #333;
            line-height: 1.8;
            font-size: 16px;
            font-family: 'Georgia', serif;
        }

        .reading-content.dark-mode {
            background: #1a1a1a;
            color: #e0e0e0;
        }

        .pdf-page {
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            display: block;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .comic-page {
            max-width: 100%;
            max-height: 90vh;
            margin: 0 auto;
            display: block;
        }

        /* Scan Dialog */
        .scan-dialog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .scan-dialog-content {
            background: #2a2a3e;
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            max-width: 90%;
            color: white;
        }

        .scan-dialog h3 {
            margin-top: 0;
            color: #667eea;
        }

        .scan-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
        }

        .scan-progress {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin: 20px 0;
            overflow: hidden;
        }

        .scan-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .scan-results {
            max-height: 200px;
            overflow-y: auto;
            margin: 15px 0;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
        }

        .dialog-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .dialog-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .dialog-button.primary {
            background: #667eea;
            color: white;
        }

        .dialog-button.secondary {
            background: #666;
            color: white;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .books-header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .books-controls {
                flex-wrap: wrap;
                justify-content: center;
            }

            .books-search {
                width: 100%;
                max-width: 300px;
            }

            .reading-content {
                padding: 20px;
                font-size: 14px;
            }
        }

        /* Loading States */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #aaa;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="books-container">
        <!-- Books Header -->
        <div class="books-header">
            <h1 class="books-title">📚 Books Library</h1>
            <div class="books-controls">
                <input type="text" class="books-search" placeholder="Search books..." id="searchInput">
                <button class="scan-button" onclick="openScanDialog()">📁 Scan Directory</button>
                <button class="view-toggle" onclick="toggleView()">🔄 Grid View</button>
            </div>
        </div>

        <!-- Books Grid -->
        <div class="books-grid" id="booksGrid">
            <div class="loading">
                <div class="spinner"></div>
                Loading books...
            </div>
        </div>
    </div>

    <!-- Reading Interface -->
    <div class="reading-interface" id="readingInterface">
        <div class="reading-header">
            <div class="reading-title" id="readingTitle">Book Title</div>
            <div class="reading-controls">
                <div class="page-navigation">
                    <button class="reading-button" onclick="previousPage()">◀ Previous</button>
                    <input type="number" class="page-input" id="currentPage" value="1" onchange="goToPage()">
                    <span style="color: #aaa;">of</span>
                    <span id="totalPages" style="color: #aaa;">1</span>
                    <button class="reading-button" onclick="nextPage()">Next ▶</button>
                </div>
                <button class="reading-button" onclick="toggleDarkMode()">🌙 Dark</button>
                <button class="reading-button" onclick="addBookmark()">🔖 Bookmark</button>
                <button class="reading-button" onclick="closeReader()">✕ Close</button>
            </div>
        </div>
        <div class="reading-content" id="readingContent">
            <!-- Book content will be loaded here -->
        </div>
    </div>

    <!-- Scan Directory Dialog -->
    <div class="scan-dialog" id="scanDialog">
        <div class="scan-dialog-content">
            <h3>📁 Scan Books Directory</h3>
            <p>Enter the path to scan for book files (EPUB, PDF, TXT, CBZ, etc.)</p>
            <input type="text" class="scan-input" id="scanPath" placeholder="/path/to/books" value="/home/ubuntu/Books">
            <div class="scan-progress" id="scanProgress" style="display: none;">
                <div class="scan-progress-bar" id="scanProgressBar"></div>
            </div>
            <div class="scan-results" id="scanResults" style="display: none;"></div>
            <div class="dialog-buttons">
                <button class="dialog-button secondary" onclick="closeScanDialog()">Cancel</button>
                <button class="dialog-button primary" onclick="startScan()">Start Scan</button>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentBooks = [];
        let currentBook = null;
        let currentPage = 0;
        let totalPages = 0;
        let readingFormat = '';
        let darkMode = false;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadBooks();
            setupSearch();
        });

        // Load books from library
        async function loadBooks() {
            try {
                const response = await fetch('/api/enhanced/books/list');
                const data = await response.json();
                
                if (data.success) {
                    currentBooks = data.books;
                    displayBooks(currentBooks);
                } else {
                    document.getElementById('booksGrid').innerHTML = 
                        '<div class="loading">❌ Error loading books: ' + data.error + '</div>';
                }
            } catch (error) {
                console.error('Error loading books:', error);
                document.getElementById('booksGrid').innerHTML = 
                    '<div class="loading">❌ Error loading books</div>';
            }
        }

        // Display books in grid
        function displayBooks(books) {
            const grid = document.getElementById('booksGrid');
            
            if (books.length === 0) {
                grid.innerHTML = `
                    <div class="loading">
                        📚 No books found. Click "Scan Directory" to add books to your library.
                    </div>
                `;
                return;
            }

            grid.innerHTML = books.map(book => `
                <div class="book-card" onclick="openBook(${book.id})">
                    ${book.cover_image ? 
                        `<img src="${book.cover_image}" class="book-cover" alt="${book.title}">` :
                        `<div class="book-cover-placeholder">📖</div>`
                    }
                    <div class="book-title">${book.title || 'Unknown Title'}</div>
                    <div class="book-author">${book.author || 'Unknown Author'}</div>
                    <div class="book-progress">
                        <div class="book-progress-bar" style="width: 0%"></div>
                    </div>
                    <div class="book-meta">
                        <span>${book.page_count || 0} pages</span>
                        <span>${book.language || 'Unknown'}</span>
                    </div>
                </div>
            `).join('');
        }

        // Search functionality
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                const filtered = currentBooks.filter(book => 
                    (book.title || '').toLowerCase().includes(query) ||
                    (book.author || '').toLowerCase().includes(query) ||
                    (book.series || '').toLowerCase().includes(query)
                );
                displayBooks(filtered);
            });
        }

        // Open scan dialog
        function openScanDialog() {
            document.getElementById('scanDialog').style.display = 'flex';
        }

        // Close scan dialog
        function closeScanDialog() {
            document.getElementById('scanDialog').style.display = 'none';
            document.getElementById('scanResults').style.display = 'none';
            document.getElementById('scanProgress').style.display = 'none';
        }

        // Start directory scan
        async function startScan() {
            const path = document.getElementById('scanPath').value.trim();
            if (!path) {
                alert('Please enter a directory path');
                return;
            }

            const progressBar = document.getElementById('scanProgressBar');
            const progress = document.getElementById('scanProgress');
            const results = document.getElementById('scanResults');
            
            progress.style.display = 'block';
            results.style.display = 'none';
            progressBar.style.width = '0%';

            try {
                // Animate progress bar
                let progressValue = 0;
                const progressInterval = setInterval(() => {
                    progressValue += 10;
                    progressBar.style.width = progressValue + '%';
                    if (progressValue >= 90) {
                        clearInterval(progressInterval);
                    }
                }, 200);

                const response = await fetch('/api/enhanced/books/scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ directory: path })
                });

                const data = await response.json();
                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                if (data.success) {
                    results.innerHTML = `
                        <div style="color: #4ade80;">✅ Scan completed successfully!</div>
                        <div>Found ${data.books_found} books</div>
                        ${data.errors.length > 0 ? 
                            `<div style="color: #f87171; margin-top: 10px;">
                                Errors: ${data.errors.slice(0, 3).join(', ')}
                                ${data.errors.length > 3 ? '...' : ''}
                            </div>` : ''
                        }
                    `;
                    results.style.display = 'block';
                    
                    // Reload books after scan
                    setTimeout(() => {
                        loadBooks();
                        closeScanDialog();
                    }, 2000);
                } else {
                    results.innerHTML = `<div style="color: #f87171;">❌ Scan failed: ${data.error}</div>`;
                    results.style.display = 'block';
                }
            } catch (error) {
                console.error('Scan error:', error);
                results.innerHTML = `<div style="color: #f87171;">❌ Scan failed: ${error.message}</div>`;
                results.style.display = 'block';
            }
        }

        // Open book for reading
        async function openBook(bookId) {
            try {
                currentBook = currentBooks.find(b => b.id === bookId);
                if (!currentBook) return;

                document.getElementById('readingTitle').textContent = currentBook.title;
                document.getElementById('readingInterface').style.display = 'flex';
                
                // Load first page
                await loadBookPage(bookId, 0);
            } catch (error) {
                console.error('Error opening book:', error);
                alert('Error opening book: ' + error.message);
            }
        }

        // Load book page content
        async function loadBookPage(bookId, page) {
            try {
                const response = await fetch(`/api/enhanced/books/${bookId}/read?page=${page}`);
                const data = await response.json();
                
                if (data.success) {
                    const content = document.getElementById('readingContent');
                    currentPage = data.current_page || data.current_chapter || 0;
                    totalPages = data.total_pages || data.total_chapters || 1;
                    readingFormat = data.format;
                    
                    document.getElementById('currentPage').value = currentPage + 1;
                    document.getElementById('totalPages').textContent = totalPages;
                    
                    if (data.format === 'epub') {
                        content.innerHTML = data.content;
                    } else if (data.format === 'pdf' || data.format === 'comic') {
                        content.innerHTML = `<img src="${data.image_data}" class="${data.format}-page" alt="Page ${currentPage + 1}">`;
                    } else if (data.format === 'text') {
                        content.innerHTML = `<pre style="white-space: pre-wrap; font-family: inherit;">${data.content}</pre>`;
                    }
                    
                    // Update reading progress
                    updateReadingProgress(bookId);
                } else {
                    alert('Error loading page: ' + data.error);
                }
            } catch (error) {
                console.error('Error loading page:', error);
                alert('Error loading page: ' + error.message);
            }
        }

        // Navigation functions
        function previousPage() {
            if (currentPage > 0 && currentBook) {
                loadBookPage(currentBook.id, currentPage - 1);
            }
        }

        function nextPage() {
            if (currentPage < totalPages - 1 && currentBook) {
                loadBookPage(currentBook.id, currentPage + 1);
            }
        }

        function goToPage() {
            const pageInput = document.getElementById('currentPage');
            const page = parseInt(pageInput.value) - 1;
            
            if (page >= 0 && page < totalPages && currentBook) {
                loadBookPage(currentBook.id, page);
            } else {
                pageInput.value = currentPage + 1;
            }
        }

        // Toggle dark mode for reading
        function toggleDarkMode() {
            const content = document.getElementById('readingContent');
            darkMode = !darkMode;
            
            if (darkMode) {
                content.classList.add('dark-mode');
            } else {
                content.classList.remove('dark-mode');
            }
        }

        // Add bookmark
        async function addBookmark() {
            if (!currentBook) return;
            
            try {
                const response = await fetch(`/api/enhanced/books/${currentBook.id}/bookmark`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: 'bookmark',
                        page_number: currentPage,
                        position_data: { format: readingFormat }
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    alert('Bookmark added successfully!');
                } else {
                    alert('Error adding bookmark: ' + data.error);
                }
            } catch (error) {
                console.error('Bookmark error:', error);
                alert('Error adding bookmark: ' + error.message);
            }
        }

        // Update reading progress
        async function updateReadingProgress(bookId) {
            try {
                const progress = totalPages > 0 ? ((currentPage + 1) / totalPages) * 100 : 0;
                
                await fetch(`/api/enhanced/books/${bookId}/progress`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        current_page: currentPage,
                        total_pages: totalPages,
                        progress_percentage: progress,
                        completed: progress >= 100
                    })
                });
            } catch (error) {
                console.error('Progress update error:', error);
            }
        }

        // Close reader
        function closeReader() {
            document.getElementById('readingInterface').style.display = 'none';
            currentBook = null;
        }

        // Toggle view (placeholder for future list view)
        function toggleView() {
            // Future implementation for list vs grid view
            alert('List view coming soon!');
        }

        // Keyboard shortcuts for reading
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('readingInterface').style.display === 'flex') {
                if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                    e.preventDefault();
                    previousPage();
                } else if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                    e.preventDefault();
                    nextPage();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeReader();
                }
            }
        });
    </script>
</body>
</html>
