<!doctype html><html><head><meta charset="utf-8"><title>Wanted — Journal</title>
<link rel="stylesheet" href="assets/normalize.css"><link rel="stylesheet" href="assets/ui.css"></head>
<body><div class="wrap">
  <div class="toolbar"><a href="home.html">← Home</a> · <strong>Wanted — Journal</strong> <a class="btn" href="wanted_automation.html">Automation</a> <a class="btn" href="wanted.html">Tracker</a></div>
  <div class="card">
    <div><button id="refresh">Refresh</button> <button id="clear">Clear</button></div>
    <div id="list" style="margin-top:8px">—</div>
  </div>
</div>
<script>
function fmt(e){
  const ts=new Date((e.ts||0)*1000).toLocaleString();
  const meta=JSON.stringify(e.meta||{});
  return `<div style="margin:6px 0"><strong>[${e.kind}]</strong> ${e.title||''} <span class="badge">${ts}</span> <code>${meta}</code></div>`;
}
async function load(){
  const j=await (await fetch('/api/wanted/journal_get?limit=500')).json();
  list.innerHTML = (j.events||[]).map(fmt).join('') || '—';
}
refresh.onclick=load;
clear.onclick=async ()=>{ await fetch('/api/wanted/journal_clear',{method:'POST'}); load(); };
document.addEventListener('DOMContentLoaded', load);
</script>
</body></html>
