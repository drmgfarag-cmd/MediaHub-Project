<!doctype html><html><head><meta charset="utf-8"><title>Features — Toggles</title>
<link rel="stylesheet" href="assets/normalize.css"><link rel="stylesheet" href="assets/ui.css"></head>
<body><div class="wrap">
  <div class="toolbar"><a href="tools.html">← Tools</a> · <strong>Features — Toggles</strong></div>
  <div class="card">
    <label><input type="checkbox" id="rss"> Enable RSS Feeder</label>
  </div>
</div>
<script>
async function load(){ const f=await (await fetch('/api/features/get')).json(); rss.checked=!!f.rss_feeder; }
rss.onchange=async ()=>{ const r=await (await fetch('/api/features/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rss_feeder: rss.checked})})).json(); };
document.addEventListener('DOMContentLoaded', load);
</script>
</body></html>
