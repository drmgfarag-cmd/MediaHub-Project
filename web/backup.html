<!doctype html><html><head><meta charset="utf-8"><title>Backup</title>
<link rel="stylesheet" href="assets/normalize.css"><link rel="stylesheet" href="assets/ui.css"></head>
<body><div class="wrap">
  <div class="toolbar"><a href="home.html">← Home</a> · <strong>Export / Import</strong></div>
  <div class="card"><button onclick="window.location='/api/backup/export'">Export settings & indexes (zip)</button></div>
  <div class="card">
    <h3>Import (JSON)</h3>
    <textarea id="payload" placeholder='{"config.json": {...}}' style="width:100%;height:160px"></textarea><br>
    <button id="send">Import</button> <span id="msg"></span>
  </div>
</div>
<script>
document.getElementById('send').onclick=async ()=>{
  try{
    const js=JSON.parse(document.getElementById('payload').value||'{}');
    const r=await fetch('/api/backup/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(js)});
    const j=await r.json(); document.getElementById('msg').textContent='Imported: '+(j.imported||[]).join(', ');
  }catch(e){ document.getElementById('msg').textContent='Invalid JSON'; }
};
</script>
<script src="assets/csrf.js"></script>
</body></html>
