<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Release Calendar - MediaHub</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { margin-bottom: 30px; }
        .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
        .header p { color: #999; font-size: 16px; }
        .time-filters { display: flex; gap: 10px; margin-bottom: 25px; }
        .time-btn { padding: 10px 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; cursor: pointer; transition: all 0.2s; }
        .time-btn:hover, .time-btn.active { background: #e50914; border-color: #e50914; }
        .calendar-view { display: flex; flex-direction: column; gap: 30px; }
        .date-section { background: #1a1a1a; border-radius: 12px; padding: 20px; }
        .date-header { font-size: 18px; font-weight: 600; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .date-label { color: #e50914; }
        .events-list { display: flex; flex-direction: column; gap: 15px; }
        .event-item { display: flex; gap: 15px; padding: 12px; background: #0f0f0f; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .event-item:hover { background: #222; }
        .event-poster { width: 60px; height: 90px; object-fit: cover; border-radius: 6px; background: #333; flex-shrink: 0; }
        .event-info { flex: 1; }
        .event-title { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
        .event-meta { font-size: 13px; color: #999; margin-bottom: 5px; }
        .event-episode { font-size: 14px; color: #ccc; }
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state svg { width: 80px; height: 80px; margin-bottom: 20px; opacity: 0.3; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .today-badge { padding: 4px 8px; background: #e50914; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Release Calendar</h1>
            <p>Upcoming releases and new episodes</p>
        </div>
        
        <div class="time-filters">
            <button class="time-btn active" onclick="filterTime(7)">Next 7 Days</button>
            <button class="time-btn" onclick="filterTime(14)">Next 2 Weeks</button>
            <button class="time-btn" onclick="filterTime(30)">Next Month</button>
            <button class="time-btn" onclick="filterTime(90)">Next 3 Months</button>
        </div>
        
        <div id="calendar-container" class="calendar-view">
            <div class="loading">Loading calendar...</div>
        </div>
        
        <div id="empty-state" class="empty-state" style="display: none;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <h2>No Upcoming Releases</h2>
            <p>No releases scheduled for the selected period</p>
        </div>
    </div>
    
    <script>
        let allEvents = [];
        let currentDays = 7;
        
        async function loadCalendar(days = 7) {
            try {
                const response = await fetch(`/api/calendar?days=${days}`);
                const data = await response.json();
                allEvents = data.events || [];
                renderCalendar();
            } catch (error) {
                console.error('Error loading calendar:', error);
                document.getElementById('calendar-container').innerHTML = '<div class="loading">Error loading calendar</div>';
            }
        }
        
        function renderCalendar() {
            const container = document.getElementById('calendar-container');
            const emptyState = document.getElementById('empty-state');
            
            if (allEvents.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            container.style.display = 'flex';
            emptyState.style.display = 'none';
            
            // Group events by date
            const eventsByDate = {};
            allEvents.forEach(event => {
                const date = event.release_date;
                if (!eventsByDate[date]) {
                    eventsByDate[date] = [];
                }
                eventsByDate[date].push(event);
            });
            
            // Sort dates
            const sortedDates = Object.keys(eventsByDate).sort();
            
            container.innerHTML = sortedDates.map(date => {
                const events = eventsByDate[date];
                const dateObj = new Date(date);
                const isToday = isDateToday(dateObj);
                const dateLabel = formatDate(dateObj);
                
                return `
                    <div class="date-section">
                        <div class="date-header">
                            <span class="date-label">${dateLabel}</span>
                            ${isToday ? '<span class="today-badge">TODAY</span>' : ''}
                            <span style="color: #666;">${events.length} release${events.length > 1 ? 's' : ''}</span>
                        </div>
                        <div class="events-list">
                            ${events.map(event => `
                                <div class="event-item" onclick="playMedia('${event.media_id}')">
                                    <img class="event-poster" src="${event.poster_url || '/static/img/placeholder.jpg'}" alt="${event.title}">
                                    <div class="event-info">
                                        <div class="event-title">${event.title}</div>
                                        <div class="event-meta">
                                            ${event.media_type === 'tv' ? '📺 TV Show' : '🎬 Movie'}
                                        </div>
                                        ${event.season && event.episode ? `
                                            <div class="event-episode">
                                                S${String(event.season).padStart(2, '0')}E${String(event.episode).padStart(2, '0')}
                                                ${event.episode_title ? ` - ${event.episode_title}` : ''}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function filterTime(days) {
            currentDays = days;
            document.querySelectorAll('.time-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadCalendar(days);
        }
        
        function isDateToday(date) {
            const today = new Date();
            return date.toDateString() === today.toDateString();
        }
        
        function formatDate(date) {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            if (date.toDateString() === today.toDateString()) {
                return 'Today';
            } else if (date.toDateString() === tomorrow.toDateString()) {
                return 'Tomorrow';
            } else {
                const options = { weekday: 'long', month: 'long', day: 'numeric' };
                return date.toLocaleDateString('en-US', options);
            }
        }
        
        function playMedia(mediaId) {
            window.location.href = `/player?id=${mediaId}`;
        }
        
        // Load on page load
        loadCalendar(currentDays);
    </script>
</body>
</html>
