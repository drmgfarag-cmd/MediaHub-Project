<!doctype html><html><head><meta charset="utf-8"><title>Readers & Audio — Settings</title>
<link rel="stylesheet" href="assets/normalize.css"><link rel="stylesheet" href="assets/ui.css"></head>
<body><div class="wrap">
  <div class="toolbar"><a href="home.html">← Home</a> · <strong>Readers & Audio — Settings</strong></div>
  <div class="card"><h3>Comics</h3>
    Fit: <select id="cfit"><option>width</option><option>height</option></select>
    <label><input type="checkbox" id="cdp"> Double page</label>
  </div>
  <div class="card"><h3>Manga</h3>
    Fit: <select id="mfit"><option>width</option><option>height</option></select>
    <label><input type="checkbox" id="mdp"> Double page</label>
    <label><input type="checkbox" id="mrtl"> RTL (right-to-left)</label>
  </div>
  <div class="card"><h3>eBooks</h3>
    Font: <input id="ef" value="Inter" style="width:200px">
    Size: <input id="efs" type="number" min="12" max="28" value="16" style="width:80px">
    Line height: <input id="elh" type="number" step="0.1" value="1.6" style="width:80px">
  </div>
  <div class="card"><h3>Audiobooks</h3>
    Default sleep timer: <input id="abst" type="number" min="0" max="120" value="0" style="width:80px"> minutes
  </div>
  <div class="card"><h3>Audio Player</h3>
    Repeat: <select id="arep"><option value="off">Off</option><option value="one">Repeat One</option><option value="all">Repeat All</option></select>
    <label><input type="checkbox" id="ash"> Shuffle</label>
  </div>
  <div><button id="save">Save</button> <span id="msg"></span></div>
</div>
<script>
async function load(){
  const p=await (await fetch('/api/reader/prefs_get')).json();
  cfit.value=(p.comics&&p.comics.fit)||'width'; cdp.checked=!!(p.comics&&p.comics.double_page);
  mfit.value=(p.manga&&p.manga.fit)||'width'; mdp.checked=!!(p.manga&&p.manga.double_page); mrtl.checked=!!(p.manga&&p.manga.rtl);
  ef.value=(p.ebooks&&p.ebooks.font)||'Inter'; efs.value=(p.ebooks&&p.ebooks.font_size)||16; elh.value=(p.ebooks&&p.ebooks.line_height)||1.6;
  abst.value=(p.audiobooks&&p.audiobooks.sleep_timer_min)||0;
  ash.checked=!!(p.audio&&p.audio.shuffle); arep.value=(p.audio&&p.audio.repeat)||'off';
}
save.onclick=async ()=>{
  const js={
    comics: {fit: cfit.value, double_page: cdp.checked},
    manga: {fit: mfit.value, double_page: mdp.checked, rtl: mrtl.checked},
    ebooks: {font: ef.value, font_size: parseInt(efs.value)||16, line_height: parseFloat(elh.value)||1.6},
    audiobooks: {sleep_timer_min: parseInt(abst.value)||0},
    audio: {repeat: arep.value, shuffle: ash.checked}
  };
  const r=await (await fetch('/api/reader/prefs_set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(js)})).json();
  msg.textContent = r.ok? 'Saved.' : 'Failed.';
};
document.addEventListener('DOMContentLoaded', load);
</script>
</body></html>
