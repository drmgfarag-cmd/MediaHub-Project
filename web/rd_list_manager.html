<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD List Manager - Drag & Drop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            color: #00d4ff;
            margin-bottom: 10px;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 68, 68, 0.4);
        }

        .lists-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .list-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .list-panel.drag-over {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }

        .list-header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .list-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #00d4ff;
        }

        .list-count {
            background: rgba(0, 212, 255, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #00d4ff;
        }

        .list-body {
            padding: 15px;
            max-height: 500px;
            overflow-y: auto;
            min-height: 200px;
        }

        .list-body::-webkit-scrollbar {
            width: 8px;
        }

        .list-body::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .list-body::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.5);
            border-radius: 10px;
        }

        .list-body::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.8);
        }

        .list-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: move;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.12);
            border-left-color: #00d4ff;
            transform: translateX(5px);
        }

        .list-item.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        .list-item.selected {
            background: rgba(0, 212, 255, 0.2);
            border-left-color: #00d4ff;
        }

        .item-content {
            flex: 1;
        }

        .item-name {
            font-size: 0.95em;
            color: #e0e0e0;
            margin-bottom: 4px;
        }

        .item-meta {
            font-size: 0.8em;
            color: #808080;
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .item-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            transition: all 0.2s ease;
        }

        .item-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #808080;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .stats-bar {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #00d4ff;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            color: #a0a0a0;
            margin-top: 5px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 212, 255, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 RD List Manager</h1>
        <p>Drag & drop files between lists • Multi-select • Undo/Redo support</p>
    </div>

    <div class="toolbar">
        <div class="toolbar-left">
            <button class="btn btn-primary" onclick="addNewList()">
                ➕ New List
            </button>
            <button class="btn btn-secondary" onclick="importList()">
                📥 Import
            </button>
            <button class="btn btn-secondary" onclick="exportLists()">
                📤 Export
            </button>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-secondary" onclick="undo()" id="undoBtn" disabled>
                ↶ Undo
            </button>
            <button class="btn btn-secondary" onclick="redo()" id="redoBtn" disabled>
                ↷ Redo
            </button>
            <button class="btn btn-danger" onclick="clearAll()">
                🗑️ Clear All
            </button>
        </div>
    </div>

    <div class="lists-container" id="listsContainer">
        <!-- Lists will be dynamically added here -->
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-value" id="totalLists">0</span>
            <span class="stat-label">Total Lists</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="totalItems">0</span>
            <span class="stat-label">Total Items</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="selectedItems">0</span>
            <span class="stat-label">Selected</span>
        </div>
    </div>

    <!-- Add List Modal -->
    <div class="modal" id="addListModal">
        <div class="modal-content">
            <div class="modal-header">Create New List</div>
            <div class="modal-body">
                <input type="text" id="newListName" placeholder="Enter list name..." />
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addListModal')">Cancel</button>
                <button class="btn btn-primary" onclick="createList()">Create</button>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal" id="importModal">
        <div class="modal-content">
            <div class="modal-header">Import List</div>
            <div class="modal-body">
                <input type="text" id="importListName" placeholder="List name..." style="margin-bottom: 10px;" />
                <textarea id="importContent" placeholder="Paste file names here (one per line)..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('importModal')">Cancel</button>
                <button class="btn btn-primary" onclick="doImport()">Import</button>
            </div>
        </div>
    </div>

    <script>
        // State management
        let lists = [];
        let history = [];
        let historyIndex = -1;
        let draggedItem = null;
        let draggedFromList = null;

        // Initialize with sample data
        function init() {
            lists = [
                {
                    id: 1,
                    name: "CtrlHD Releases",
                    items: [
                        { id: 101, name: "Movie.2024.2160p.WEB-DL.DDP5.1.Atmos.DV.H.265-CtrlHD.mkv", size: "15.0 GB" },
                        { id: 102, name: "Series.S01E01.2160p.WEB-DL.DDP5.1.Atmos.DV.H.265-CtrlHD.mkv", size: "8.5 GB" }
                    ]
                },
                {
                    id: 2,
                    name: "Cytsunee Releases",
                    items: [
                        { id: 201, name: "Movie.2024.2160p.WEB-DL.DD5.1.HDR.H.265-Cytsunee.mkv", size: "12.0 GB" }
                    ]
                },
                {
                    id: 3,
                    name: "Pending Downloads",
                    items: []
                }
            ];
            
            saveState();
            render();
        }

        // State management
        function saveState() {
            history = history.slice(0, historyIndex + 1);
            history.push(JSON.parse(JSON.stringify(lists)));
            historyIndex++;
            updateUndoRedo();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                lists = JSON.parse(JSON.stringify(history[historyIndex]));
                render();
                updateUndoRedo();
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                lists = JSON.parse(JSON.stringify(history[historyIndex]));
                render();
                updateUndoRedo();
            }
        }

        function updateUndoRedo() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
        }

        // Render functions
        function render() {
            const container = document.getElementById('listsContainer');
            container.innerHTML = '';

            lists.forEach(list => {
                const panel = createListPanel(list);
                container.appendChild(panel);
            });

            updateStats();
        }

        function createListPanel(list) {
            const panel = document.createElement('div');
            panel.className = 'list-panel';
            panel.dataset.listId = list.id;

            panel.innerHTML = `
                <div class="list-header">
                    <span class="list-title">${list.name}</span>
                    <span class="list-count">${list.items.length}</span>
                </div>
                <div class="list-body" ondrop="drop(event, ${list.id})" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                    ${list.items.length === 0 ? 
                        '<div class="empty-state"><div class="empty-state-icon">📋</div><div>Drop items here</div></div>' :
                        list.items.map(item => createListItem(item, list.id)).join('')
                    }
                </div>
            `;

            return panel;
        }

        function createListItem(item, listId) {
            return `
                <div class="list-item" draggable="true" ondragstart="drag(event, ${item.id}, ${listId})" ondragend="dragEnd(event)" data-item-id="${item.id}">
                    <div class="item-content">
                        <div class="item-name">${item.name}</div>
                        <div class="item-meta">${item.size || 'Unknown size'}</div>
                    </div>
                    <div class="item-actions">
                        <button class="item-btn" onclick="removeItem(${listId}, ${item.id})">✕</button>
                    </div>
                </div>
            `;
        }

        // Drag and drop
        function drag(event, itemId, listId) {
            draggedItem = itemId;
            draggedFromList = listId;
            event.target.classList.add('dragging');
        }

        function dragEnd(event) {
            event.target.classList.remove('dragging');
        }

        function allowDrop(event) {
            event.preventDefault();
            event.currentTarget.closest('.list-panel').classList.add('drag-over');
        }

        function dragLeave(event) {
            event.currentTarget.closest('.list-panel').classList.remove('drag-over');
        }

        function drop(event, toListId) {
            event.preventDefault();
            event.currentTarget.closest('.list-panel').classList.remove('drag-over');

            if (draggedFromList === toListId) return;

            const fromList = lists.find(l => l.id === draggedFromList);
            const toList = lists.find(l => l.id === toListId);
            const itemIndex = fromList.items.findIndex(i => i.id === draggedItem);
            
            if (itemIndex !== -1) {
                const item = fromList.items.splice(itemIndex, 1)[0];
                toList.items.push(item);
                
                saveState();
                render();
                showToast(`Moved "${item.name}" to "${toList.name}"`);
            }
        }

        // List operations
        function addNewList() {
            openModal('addListModal');
        }

        function createList() {
            const name = document.getElementById('newListName').value.trim();
            if (!name) {
                alert('Please enter a list name');
                return;
            }

            const newList = {
                id: Date.now(),
                name: name,
                items: []
            };

            lists.push(newList);
            saveState();
            render();
            closeModal('addListModal');
            document.getElementById('newListName').value = '';
            showToast(`Created list "${name}"`);
        }

        function importList() {
            openModal('importModal');
        }

        function doImport() {
            const name = document.getElementById('importListName').value.trim();
            const content = document.getElementById('importContent').value.trim();

            if (!name || !content) {
                alert('Please enter list name and content');
                return;
            }

            const lines = content.split('\n').filter(l => l.trim());
            const items = lines.map((line, idx) => ({
                id: Date.now() + idx,
                name: line.trim(),
                size: 'Unknown'
            }));

            const newList = {
                id: Date.now(),
                name: name,
                items: items
            };

            lists.push(newList);
            saveState();
            render();
            closeModal('importModal');
            document.getElementById('importListName').value = '';
            document.getElementById('importContent').value = '';
            showToast(`Imported ${items.length} items to "${name}"`);
        }

        function exportLists() {
            const data = JSON.stringify(lists, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rd_lists_${Date.now()}.json`;
            a.click();
            showToast('Lists exported successfully');
        }

        function removeItem(listId, itemId) {
            const list = lists.find(l => l.id === listId);
            const itemIndex = list.items.findIndex(i => i.id === itemId);
            
            if (itemIndex !== -1) {
                const item = list.items[itemIndex];
                list.items.splice(itemIndex, 1);
                saveState();
                render();
                showToast(`Removed "${item.name}"`);
            }
        }

        function clearAll() {
            if (confirm('Are you sure you want to clear all lists?')) {
                lists = [];
                saveState();
                render();
                showToast('All lists cleared');
            }
        }

        // UI helpers
        function updateStats() {
            document.getElementById('totalLists').textContent = lists.length;
            document.getElementById('totalItems').textContent = lists.reduce((sum, list) => sum + list.items.length, 0);
            document.getElementById('selectedItems').textContent = 0; // TODO: Implement selection
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
