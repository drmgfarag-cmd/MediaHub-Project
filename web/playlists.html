<!doctype html><html><head><meta charset="utf-8"><title>Playlists</title>
<link rel="stylesheet" href="assets/normalize.css"><link rel="stylesheet" href="assets/ui.css"></head>
<body><div class="wrap">
  <div class="toolbar"><a href="home.html">← Home</a> · <strong>Playlists</strong> <input id="name" placeholder="New playlist"><button id="add">Create</button></div>
  <div id="root"></div>
</div>
<script>
async function load(){ const j=await (await fetch('/api/music/playlists')).json(); const r=document.getElementById('root'); r.innerHTML=''; (j.lists||[]).forEach(l=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML = `<h3>${l.name}</h3><ol>${(l.tracks||[]).map(t=>`<li>${t.title||t.path||''}</li>`).join('')}</ol>`; r.appendChild(d); }); }
document.getElementById('add').onclick=async()=>{ const n=document.getElementById('name').value.trim(); if(!n) return; await fetch('/api/music/playlist_create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})}); load(); };
document.addEventListener('DOMContentLoaded', load);
</script>
<script src="assets/app_a11y.js"></script>
<script src="assets/csrf.js"></script>
</body></html>
