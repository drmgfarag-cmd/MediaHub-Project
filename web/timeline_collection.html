<!doctype html><html><head><meta charset="utf-8"><title>Collection Timeline</title>
<link rel="stylesheet" href="assets/normalize.css"><link rel="stylesheet" href="assets/ui.css"></head>
<body><div class="wrap">
  <div class="toolbar"><a href="collections_browser.html">← Collections</a> · <strong id="ttl">Timeline</strong></div>
  <div class="card" id="out">—</div>
</div>
<script>
function qp(k){ const u=new URL(location.href); return u.searchParams.get(k)||''; }
async function load(){
  const name=qp('name'); ttl.textContent=name;
  const j=await (await fetch('/api/timeline/for_collection?name='+encodeURIComponent(name))).json();
  out.innerHTML=(j.buckets||[]).map(b=>`<div style="margin:8px 0"><h3>${b.year}</h3>` + (b.items||[]).map(i=>`<div>${i.title}</div>`).join('') + `</div>`).join('') || 'No items';
}
document.addEventListener('DOMContentLoaded', load);
</script>
</body></html>
