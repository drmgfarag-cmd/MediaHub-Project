<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - MediaHub</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 32px; font-weight: 700; }
        .sort-options { display: flex; gap: 10px; align-items: center; }
        .sort-btn { padding: 8px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #fff; cursor: pointer; font-size: 14px; }
        .sort-btn:hover { background: #333; }
        .favorites-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .favorite-item { background: #1a1a1a; border-radius: 8px; overflow: hidden; position: relative; transition: transform 0.2s; }
        .favorite-item:hover { transform: scale(1.05); }
        .poster { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #333; cursor: pointer; }
        .info { padding: 12px; }
        .title { font-size: 14px; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .meta { font-size: 12px; color: #999; margin-bottom: 8px; }
        .rating { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #ffd700; }
        .remove-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); border: none; border-radius: 50%; width: 32px; height: 32px; color: #fff; cursor: pointer; font-size: 18px; display: none; }
        .favorite-item:hover .remove-btn { display: block; }
        .remove-btn:hover { background: #e50914; }
        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state svg { width: 80px; height: 80px; margin-bottom: 20px; opacity: 0.3; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .tag { padding: 3px 8px; background: #333; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⭐ My Favorites</h1>
            <div class="sort-options">
                <span style="color: #999; font-size: 14px;">Sort by:</span>
                <select class="sort-btn" onchange="sortFavorites(this.value)">
                    <option value="recent">Recently Added</option>
                    <option value="title">Title (A-Z)</option>
                    <option value="rating">Rating</option>
                    <option value="type">Type</option>
                </select>
            </div>
        </div>
        
        <div id="favorites-container" class="favorites-grid">
            <div class="loading">Loading favorites...</div>
        </div>
        
        <div id="empty-state" class="empty-state" style="display: none;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
            </svg>
            <h2>No Favorites Yet</h2>
            <p>Add some favorites to see them here!</p>
        </div>
    </div>
    
    <script>
        let allFavorites = [];
        
        async function loadFavorites() {
            try {
                const response = await fetch('/api/favorites');
                const data = await response.json();
                allFavorites = data.favorites || [];
                renderFavorites();
            } catch (error) {
                console.error('Error loading favorites:', error);
                document.getElementById('favorites-container').innerHTML = '<div class="loading">Error loading favorites</div>';
            }
        }
        
        function renderFavorites() {
            const container = document.getElementById('favorites-container');
            const emptyState = document.getElementById('empty-state');
            
            if (allFavorites.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }
            
            container.style.display = 'grid';
            emptyState.style.display = 'none';
            
            container.innerHTML = allFavorites.map(item => {
                const tags = item.tags ? item.tags.split(',') : [];
                const rating = item.rating ? `⭐ ${item.rating.toFixed(1)}` : '';
                
                return `
                    <div class="favorite-item">
                        <button class="remove-btn" onclick="removeFavorite('${item.media_id}', event)">×</button>
                        <img class="poster" src="${item.poster_url || '/static/img/placeholder.jpg'}" alt="${item.title}" onclick="playMedia('${item.media_id}')">
                        <div class="info">
                            <div class="title" onclick="playMedia('${item.media_id}')">${item.title}</div>
                            <div class="meta">
                                ${item.media_type === 'movie' ? '🎬 Movie' : '📺 TV Show'}
                                ${rating ? `<span class="rating">${rating}</span>` : ''}
                            </div>
                            ${tags.length > 0 ? `
                                <div class="tags">
                                    ${tags.map(tag => `<span class="tag">${tag.trim()}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function sortFavorites(sortBy) {
            switch(sortBy) {
                case 'title':
                    allFavorites.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case 'rating':
                    allFavorites.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                    break;
                case 'type':
                    allFavorites.sort((a, b) => a.media_type.localeCompare(b.media_type));
                    break;
                default: // recent
                    allFavorites.sort((a, b) => new Date(b.added_at) - new Date(a.added_at));
            }
            renderFavorites();
        }
        
        async function removeFavorite(mediaId, event) {
            event.stopPropagation();
            
            if (!confirm('Remove from favorites?')) return;
            
            try {
                await fetch(`/api/favorites/${mediaId}`, { method: 'DELETE' });
                allFavorites = allFavorites.filter(item => item.media_id !== mediaId);
                renderFavorites();
            } catch (error) {
                console.error('Error removing favorite:', error);
                alert('Failed to remove favorite');
            }
        }
        
        function playMedia(mediaId) {
            window.location.href = `/player?id=${mediaId}`;
        }
        
        // Load on page load
        loadFavorites();
    </script>
</body>
</html>
